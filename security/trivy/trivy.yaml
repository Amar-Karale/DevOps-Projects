scan:
  scanners:
    - vuln
    - secret
  skip-dirs:
    - node_modules
    - .git
    - frontend/node_modules
    - backend/node_modules

misconfiguration:
  scanners:
    - misconfig
    - secret

vulnerability:
  ignore-unfixed: true
  severity:
    - CRITICAL
    - HIGH

secret:
  config: security/trivy/trivy-secret.yaml
