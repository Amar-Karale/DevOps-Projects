apiVersion: v1
kind: Secret
metadata:
  name: backend-env
  namespace: wanderlust
type: Opaque
stringData:
  MONGODB_URI: "mongodb://mongo-service:27017/wanderlust"
  REDIS_URL: "redis://redis-service:6379"
  FRONTEND_URL: "https://YOUR-CLOUDFRONT-DOMAIN"
  JWT_SECRET: "REPLACE_WITH_A_RANDOM_SECRET"
  NODE_ENV: "production"
